# Checks every pull request to main: it must come from dev, raise the version, and build.
# Make these checks required in the branch protection of main, see the README (Releases).
name: PR to main

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Only dev may go to main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Only the dev branch of this repository may be merged into main (this is $HEAD_REPO:$HEAD_REF)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The version must be higher than on main
        run: |
          new=$(tools/version.sh)
          git show origin/main:src/version.asm > /tmp/main-version.asm 2>/dev/null || true
          old=$(tools/version.sh /tmp/main-version.asm)
          echo "main: ${old:-none}   this pull request: $new"
          if [ -z "$new" ]; then
            echo "::error::No version found in src/version.asm"
            exit 1
          fi
          if [ -n "$old" ]; then
            highest=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)
            if [ "$new" = "$old" ] || [ "$highest" != "$new" ]; then
              echo "::error::Raise the version in src/version.asm: it is $new, main already has $old"
              exit 1
            fi
          fi

      - name: Install the assembler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends acme

      - name: It must build
        run: make
