# When something lands on main (only possible through a pull request from dev): build, tag and release.
# The release gets the .prg (emulators, Kung Fu Flash, Ultimate) and the .d64 (disk image, SD2IEC, Ultimate, emulators).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write   # needed to create the tag and the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the assembler and c1541 (the disk image tool, part of VICE)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends acme vice

      - name: Build the release files
        run: make dist

      - name: Show what is on the disk image
        run: c1541 build/raster-rumble.d64 -list

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tools/version.sh)
          if [ -z "$version" ]; then
            echo "::error::No version found in src/version.asm"
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::Release v$version already exists, raise the version in src/version.asm"
            exit 1
          fi
          gh release create "v$version" build/dist/* \
            --target "$GITHUB_SHA" \
            --title "raster rumble v$version (alpha)" \
            --generate-notes

      # The newest build also goes to the 'play' branch, for the "play in your browser" button in the README.
      # GitHub does not let other websites read release files (no CORS), but it does for raw.githubusercontent.com,
      # so the emulator at vc64web.github.io can only load the game from a place like this.
      # The branch holds one commit with just the .prg, replaced on every release. 'main' is not touched.
      - name: Put the newest build on the play branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tools/version.sh)
          play=$(mktemp -d)
          cp build/raster-rumble.prg "$play/raster-rumble.prg"
          printf 'This branch only holds the newest build of raster-rumble, v%s, replaced on every release.\nIt is made by .github/workflows/release.yml. The code is on the main branch.\n' "$version" > "$play/README.txt"
          cd "$play"
          git init -q -b play
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raster-rumble.prg README.txt
          git commit -q -m "Build of v$version"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" play
